<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<title>Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,800&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090f;--bg2:#0c111b;--card:#101624;--line:#1e2840;
  --txt:#eef2fa;--mut:#8592aa;--azul:#2b8cff;--azul2:#7cc0ff;--verm:#ff2d55;--zap:#25d366;
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font:16px/1.45 Barlow,system-ui,sans-serif;min-height:100vh;padding-bottom:120px;
  background-image:radial-gradient(900px 420px at 90% -10%,rgba(43,140,255,.18),transparent 60%),radial-gradient(700px 360px at -10% 0%,rgba(255,45,85,.12),transparent 60%);background-attachment:fixed}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{padding:26px 0 18px}
.logo{display:block;max-height:110px;max-width:min(320px,80%);object-fit:contain;margin-bottom:12px}
.marca{font-family:var(--cond);font-style:italic;font-weight:800;font-size:clamp(42px,10vw,68px);line-height:.9;text-transform:uppercase;text-shadow:0 0 20px rgba(43,140,255,.55)}
.marca span{color:var(--verm);text-shadow:0 0 20px rgba(255,45,85,.6)}
.slogan{color:var(--mut);margin-top:10px;max-width:560px}
.insta{display:inline-block;margin-top:10px;color:var(--azul2);text-decoration:none;font-weight:600;font-size:14px}
.filtros{position:sticky;top:0;z-index:5;background:rgba(7,9,15,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 0}
.campo-busca{position:relative}
.campo-busca svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mut)}
.busca{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 40px;outline:none}
.busca:focus{border-color:var(--azul);box-shadow:0 0 0 3px rgba(43,140,255,.2)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips[hidden]{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:7px 15px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--azul);border-color:var(--azul);color:#fff;box-shadow:0 0 14px rgba(43,140,255,.5)}
.subchips .chip{padding:5px 12px;font-size:13px;background:transparent}
.subchips .chip.on{background:rgba(43,140,255,.15);color:var(--azul2);box-shadow:none;border-color:var(--azul)}
.sec-tit{font-family:var(--cond);font-style:italic;font-weight:800;font-size:30px;text-transform:uppercase;margin:26px 0 2px;display:flex;align-items:center;gap:12px}
.sec-tit::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--azul),transparent)}
.sub-tit{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--azul2);margin:16px 0 0}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:12px 0 4px}
@media(min-width:700px){.grade{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,box-shadow .2s}
.card.sel{border-color:var(--azul);box-shadow:0 0 0 1px var(--azul),0 0 22px rgba(43,140,255,.25)}
.card.off{opacity:.55}
.foto{aspect-ratio:1;background:#0a0e17;position:relative;overflow:hidden}
.foto>img{width:100%;height:100%;object-fit:cover;display:block}
.slides{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.slides::-webkit-scrollbar{display:none}
.slides img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start}
.pontos{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.pontos i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);transition:.2s}
.pontos i.on{background:#fff;width:16px;border-radius:3px}
.seta{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:20px;line-height:1;cursor:pointer;opacity:0;transition:opacity .2s}
.seta.esq{left:6px}.seta.dir{right:6px}
@media(hover:hover){.foto:hover .seta{opacity:1}}
.semfoto{width:100%;height:100%;display:grid;place-items:center;font:italic 800 44px var(--cond);color:#2a3854;background:linear-gradient(135deg,#0d1322,#141d31)}
.tag{position:absolute;top:8px;left:8px;background:var(--verm);color:#fff;font:700 11px/1 Barlow,sans-serif;letter-spacing:.6px;text-transform:uppercase;padding:5px 8px;border-radius:6px;z-index:1}
.tag.esg{background:#2a3247}
.n-fotos{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;padding:4px 7px;border-radius:6px;z-index:1}
.info{padding:12px 12px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.cat{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--azul2);font-weight:700}
.nome{font-family:var(--cond);font-weight:700;font-size:20px;line-height:1.1}
.desc{color:var(--mut);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.preco{font-family:var(--cond);font-weight:700;font-size:23px;margin-top:auto;padding-top:6px}
.preco.gb{color:var(--azul2)}
.preco.cons{font:600 15px Barlow,sans-serif;color:var(--mut);padding-top:8px}
.acao{padding:0 12px 12px}
.btn-add{width:100%;border:1px solid var(--azul);background:transparent;color:var(--azul2);border-radius:10px;padding:10px;font-weight:700;cursor:pointer}
.btn-add:hover{background:rgba(43,140,255,.12)}
.btn-add.on{background:var(--azul);color:#fff}
.btn-add:disabled{border-color:var(--line);color:var(--mut);cursor:default;background:none}
.qtd{display:flex;align-items:center;justify-content:space-between;background:var(--azul);border-radius:10px;overflow:hidden}
.qtd button{background:none;border:0;width:44px;height:40px;font-size:22px;font-weight:700;cursor:pointer;color:#fff}
.qtd button:active{background:rgba(255,255,255,.15)}
.qtd span{font-weight:700;color:#fff}
.vazio{text-align:center;color:var(--mut);padding:50px 10px}
.rodape{border-top:1px solid var(--line);margin-top:30px;padding:22px 0;color:var(--mut);font-size:14px;white-space:pre-line}
.rodape:empty{display:none}
.barra{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(7,9,15,.96) 35%);transform:translateY(130%);transition:transform .25s}
.barra.on{transform:none}
.barra button{max-width:560px;margin:0 auto;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--azul);color:#fff;border:0;border-radius:14px;padding:15px 18px;font-weight:700;cursor:pointer;box-shadow:0 8px 30px rgba(43,140,255,.45)}
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.fundo.on{opacity:1;pointer-events:auto}
.gaveta{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:90vh;max-height:90dvh;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .25s;display:flex;flex-direction:column;max-width:620px;margin:0 auto}
.gaveta.on{transform:none}
.g-topo{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.g-topo h2{font-family:var(--cond);font-style:italic;font-weight:800;font-size:26px;text-transform:uppercase}
.fechar{background:none;border:0;font-size:30px;line-height:1;cursor:pointer;color:var(--mut);width:40px;height:40px}
.g-corpo{overflow:auto;padding:6px 18px 14px}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item img,.item .mini{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;background:#141d31}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--mut)}
.item .qtd{width:112px;flex:none}
.item .qtd button{width:36px;height:34px;font-size:18px}
.item .rm{flex:none;border:1px solid var(--line);background:none;border-radius:8px;width:36px;height:34px;color:var(--mut);cursor:pointer;font-size:16px}
.campo{margin-top:14px}
.campo label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px;font-weight:600}
.campo input,.campo textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none;resize:vertical}
.campo input:focus,.campo textarea:focus{border-color:var(--azul)}
.g-pe{padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.total{display:flex;justify-content:space-between;align-items:baseline}
.total+.total{margin-top:2px}
.total b{font-family:var(--cond);font-size:26px}
.total.gb b{color:var(--azul2)}
.aviso-c{font-size:13px;color:var(--mut);text-align:right}
.zap{width:100%;margin-top:12px;border:0;border-radius:14px;padding:15px;background:var(--zap);color:#04290f;font-weight:800;font-size:16px;cursor:pointer;display:flex;gap:10px;justify-content:center;align-items:center}
.limpar{display:block;margin:10px auto 0;background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:14px}
</style>
</head>
<body>
<header class="wrap">
  <img class="logo" id="logo" alt="" hidden>
  <h1 class="marca" id="marca"></h1>
  <p class="slogan" id="slogan"></p>
  <a class="insta" id="insta" target="_blank" rel="noopener" hidden></a>
</header>

<div class="filtros"><div class="wrap">
  <div class="campo-busca">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input class="busca" id="busca" type="search" placeholder="Buscar produto…" aria-label="Buscar produto">
  </div>
  <div class="chips" id="chips" hidden></div>
  <div class="chips subchips" id="subchips" hidden></div>
</div></div>

<main class="wrap">
  <div id="conteudo"><p class="vazio">Carregando…</p></div>
  <footer class="rodape" id="rodape"></footer>
</main>

<div class="barra" id="barra"><button id="abrir"><span id="b-qtd">0 itens</span><span>Ver seleção →</span></button></div>
<div class="fundo" id="fundo"></div>
<aside class="gaveta" id="gaveta" aria-label="Sua seleção">
  <div class="g-topo"><h2>Sua seleção</h2><button class="fechar" id="fechar" aria-label="Fechar">×</button></div>
  <div class="g-corpo">
    <div id="lista"></div>
    <div class="campo"><label for="nome">Seu nome</label><input id="nome" autocomplete="name" placeholder="Como podemos te chamar?"></div>
    <div class="campo"><label for="obs">Observação (opcional)</label><textarea id="obs" rows="2" placeholder="Ex.: modelo do console, forma de pagamento…"></textarea></div>
  </div>
  <div class="g-pe">
    <div id="totais"></div>
    <button class="zap" id="enviar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.3-4.4A9 9 0 1 1 21 12z"/></svg>
      Enviar pelo WhatsApp
    </button>
    <button class="limpar" id="limpar">Limpar seleção</button>
  </div>
</aside>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => Number(v).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const num = v => Number(v).toLocaleString('pt-BR', {maximumFractionDigits: 2});
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const iniciais = n => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const ler = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch (e) { return d } };
const gravar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} };
const ehGB = p => p.unidade === 'GB';
const temValor = p => typeof p.valor === 'number' && isFinite(p.valor);

let loja = {}, categorias = [], produtos = [], cat = '', sub = '', termo = '';
let sel = ler('catalogo-selecao', {});

// Aceita o formato antigo e o novo do produtos.json
function normalizar(d) {
  const cats = (Array.isArray(d.categorias) ? d.categorias : []).map(c => ({id: String(c.id), nome: c.nome || '', subs: Array.isArray(c.subs) ? c.subs : []}));
  const acharCat = v => {
    if (!v) return '';
    let c = cats.find(x => x.id === v) || cats.find(x => norm(x.nome) === norm(v));
    if (!c) { c = {id: 'c-' + norm(v), nome: String(v), subs: []}; cats.push(c); }
    return c.id;
  };
  const ps = (Array.isArray(d.produtos) ? d.produtos : []).map(p => {
    const categoria = acharCat(p.categoria), c = cats.find(x => x.id === categoria);
    const v = typeof p.valor === 'number' ? p.valor : p.preco;
    return {
      id: String(p.id), nome: p.nome || '', descricao: p.descricao || '', categoria,
      subcategoria: c && c.subs.some(s => s.id === p.subcategoria) ? p.subcategoria : '',
      unidade: p.unidade === 'GB' ? 'GB' : 'R$', valor: typeof v === 'number' ? v : null,
      imagens: Array.isArray(p.imagens) ? p.imagens.filter(Boolean) : (p.imagem ? [p.imagem] : []),
      disponivel: p.disponivel !== false, destaque: !!p.destaque
    };
  });
  return {loja: d.loja || {}, categorias: cats, produtos: ps};
}

async function iniciar() {
  try {
    const r = await fetch('data/produtos.json?v=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) throw new Error(r.status);
    ({loja, categorias, produtos} = normalizar(await r.json()));
  } catch (e) {
    $('conteudo').innerHTML = '<p class="vazio">Não foi possível carregar o catálogo agora. Tente novamente em instantes.</p>';
    return;
  }
  for (const id in sel) {
    const p = produtos.find(x => x.id === id);
    if (!p || !p.disponivel) delete sel[id];
    else if (ehGB(p)) sel[id] = 1;
  }
  gravar('catalogo-selecao', sel);
  cabecalho(); chips(); render(); atualizar();
  $('nome').value = ler('catalogo-nome', '');
}

function cabecalho() {
  const nome = loja.nome || 'Catálogo';
  document.title = nome + ' · Catálogo';
  if (loja.logo) { $('logo').src = loja.logo; $('logo').alt = nome; $('logo').hidden = false; }
  if (!loja.logo || !loja.ocultarNome) {
    const partes = esc(nome).split(' ');
    $('marca').innerHTML = partes.length > 1 ? partes.slice(0, -1).join(' ') + ' <span>' + partes[partes.length - 1] + '</span>' : partes[0];
  } else $('marca').hidden = true;
  $('slogan').textContent = loja.slogan || '';
  if (loja.instagram) {
    const u = String(loja.instagram).replace(/^@/, '');
    $('insta').href = 'https://instagram.com/' + encodeURIComponent(u);
    $('insta').textContent = '@' + u + ' no Instagram';
    $('insta').hidden = false;
  }
  $('rodape').textContent = loja.rodape || '';
}

// ---------- filtros ----------
const comItens = () => categorias.filter(c => produtos.some(p => p.categoria === c.id));
function chips() {
  const cs = comItens();
  $('chips').hidden = cs.length < 2;
  $('chips').innerHTML = [{id: '', nome: 'Todos'}, ...cs].map(c => `<button class="chip${c.id === cat ? ' on' : ''}" data-c="${esc(c.id)}">${esc(c.nome)}</button>`).join('');
  const c = categorias.find(x => x.id === cat);
  const subs = c ? c.subs.filter(s => produtos.some(p => p.subcategoria === s.id)) : [];
  $('subchips').hidden = !subs.length;
  $('subchips').innerHTML = [{id: '', nome: 'Todas'}, ...subs].map(s => `<button class="chip${s.id === sub ? ' on' : ''}" data-s="${esc(s.id)}">${esc(s.nome)}</button>`).join('');
}
$('chips').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; cat = b.dataset.c; sub = ''; chips(); render(); });
$('subchips').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (!b) return; sub = b.dataset.s; chips(); render(); });
$('busca').addEventListener('input', e => { termo = norm(e.target.value); render(); });

// ---------- cards ----------
function textoValor(p) {
  if (ehGB(p)) return temValor(p) ? `<div class="preco gb">${num(p.valor)} GB</div>` : '';
  return temValor(p) ? `<div class="preco">${brl(p.valor)}</div>` : '<div class="preco cons">Preço sob consulta</div>';
}
function botao(p) {
  if (!p.disponivel) return '<button class="btn-add" disabled>Indisponível</button>';
  const q = sel[p.id] || 0, id = esc(p.id);
  if (ehGB(p)) return q ? `<button class="btn-add on" data-a="x" data-id="${id}">✓ Selecionado</button>` : `<button class="btn-add" data-a="+" data-id="${id}">Selecionar</button>`;
  return q
    ? `<div class="qtd"><button data-a="-" data-id="${id}" aria-label="Diminuir">−</button><span>${q}</span><button data-a="+" data-id="${id}" aria-label="Aumentar">+</button></div>`
    : `<button class="btn-add" data-a="+" data-id="${id}">Selecionar</button>`;
}
function fotos(p) {
  const im = p.imagens, alt = esc(p.nome);
  if (!im.length) return `<div class="semfoto">${esc(iniciais(p.nome))}</div>`;
  if (im.length === 1) return `<img src="${esc(im[0])}" alt="${alt}" loading="lazy">`;
  return `<div class="slides">${im.map((s, i) => `<img src="${esc(s)}" alt="${alt} — foto ${i + 1}" loading="lazy">`).join('')}</div>
    <span class="n-fotos">${im.length} fotos</span>
    <button class="seta esq" data-seta="-1" aria-label="Foto anterior">‹</button>
    <button class="seta dir" data-seta="1" aria-label="Próxima foto">›</button>
    <div class="pontos">${im.map((_, i) => `<i${i ? '' : ' class="on"'}></i>`).join('')}</div>`;
}
function card(p) {
  const tag = !p.disponivel ? '<span class="tag esg">Esgotado</span>' : p.destaque ? '<span class="tag">Destaque</span>' : '';
  return `
    <article class="card${sel[p.id] ? ' sel' : ''}${p.disponivel ? '' : ' off'}" data-id="${esc(p.id)}">
      <div class="foto">${fotos(p)}${tag}</div>
      <div class="info">
        <h3 class="nome">${esc(p.nome)}</h3>
        ${p.descricao ? `<p class="desc">${esc(p.descricao)}</p>` : ''}
        ${textoValor(p)}
      </div>
      <div class="acao">${botao(p)}</div>
    </article>`;
}

function render() {
  const lista = produtos.filter(p =>
    (!cat || p.categoria === cat) && (!sub || p.subcategoria === sub) &&
    (!termo || norm(p.nome + ' ' + p.descricao).includes(termo)));
  if (!lista.length) { $('conteudo').innerHTML = '<p class="vazio">Nenhum produto encontrado.</p>'; return; }
  const grupos = [...categorias, {id: '', nome: 'Outros', subs: []}];
  const variasSecoes = new Set(lista.map(p => p.categoria)).size > 1;
  let html = '';
  for (const c of grupos) {
    const daCat = lista.filter(p => p.categoria === c.id);
    if (!daCat.length) continue;
    let sec = '';
    for (const s of [{id: '', nome: ''}, ...c.subs]) {
      const its = daCat.filter(p => s.id ? p.subcategoria === s.id : !c.subs.some(x => x.id === p.subcategoria));
      if (!its.length) continue;
      if (s.nome && !sub) sec += `<h3 class="sub-tit">${esc(s.nome)}</h3>`;
      sec += `<div class="grade">${its.map(card).join('')}</div>`;
    }
    const titulo = !cat && (variasSecoes || c.id) ? `<h2 class="sec-tit">${esc(c.nome)}</h2>` : '';
    html += `<section>${titulo}${sec}</section>`;
  }
  $('conteudo').innerHTML = html;
  document.querySelectorAll('.slides').forEach(el => el.addEventListener('scroll', () => {
    const i = Math.round(el.scrollLeft / el.clientWidth);
    el.parentElement.querySelectorAll('.pontos i').forEach((d, k) => d.classList.toggle('on', k === i));
  }, {passive: true}));
}

// ---------- seleção ----------
document.addEventListener('click', e => {
  const seta = e.target.closest('[data-seta]');
  if (seta) {
    const el = seta.parentElement.querySelector('.slides'), w = el.clientWidth;
    const fim = el.scrollLeft + w >= el.scrollWidth - 2, ini = el.scrollLeft <= 2, d = +seta.dataset.seta;
    if (d > 0 && fim) el.scrollTo({left: 0, behavior: 'smooth'});
    else if (d < 0 && ini) el.scrollTo({left: el.scrollWidth, behavior: 'smooth'});
    else el.scrollBy({left: d * w, behavior: 'smooth'});
    return;
  }
  const b = e.target.closest('[data-a]'); if (!b) return;
  const id = b.dataset.id, p = produtos.find(x => x.id === id);
  if (!p || !p.disponivel) return;
  let q = sel[id] || 0;
  if (b.dataset.a === 'x') q = 0;
  else q = ehGB(p) ? (b.dataset.a === '+' ? 1 : 0) : Math.max(0, q + (b.dataset.a === '+' ? 1 : -1));
  if (q) sel[id] = q; else delete sel[id];
  gravar('catalogo-selecao', sel);
  const c = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  if (c) { c.classList.toggle('sel', !!q); c.querySelector('.acao').innerHTML = botao(p); }
  atualizar();
});

function itensSel() {
  return Object.entries(sel).map(([id, q]) => ({p: produtos.find(x => x.id === id), q})).filter(x => x.p);
}
function somas(it) {
  let reais = 0, gb = 0, cons = 0, temR = false, temGB = false;
  it.forEach(({p, q}) => {
    if (ehGB(p)) { temGB = true; if (temValor(p)) gb += p.valor * q; }
    else if (temValor(p)) { temR = true; reais += p.valor * q; }
    else cons++;
  });
  return {reais, gb, cons, temR, temGB};
}
function atualizar() {
  const it = itensSel(), n = it.reduce((s, x) => s + x.q, 0), aberta = $('gaveta').classList.contains('on');
  const t = somas(it);
  $('barra').classList.toggle('on', n > 0 && !aberta);
  $('b-qtd').textContent = (n === 1 ? '1 item' : n + ' itens') + (t.temGB && t.gb ? ` · ${num(t.gb)} GB` : '');
  let tot = '';
  if (t.temR || !t.temGB) tot += `<div class="total"><span>Total estimado</span><b>${brl(t.reais)}</b></div>`;
  if (t.temGB) tot += `<div class="total gb"><span>Total em GB</span><b>${num(t.gb)} GB</b></div>`;
  if (t.cons) tot += `<p class="aviso-c">+ ${t.cons} ${t.cons === 1 ? 'item' : 'itens'} com preço sob consulta</p>`;
  $('totais').innerHTML = tot;
  $('lista').innerHTML = it.map(({p}) => `
    <div class="item">
      ${p.imagens[0] ? `<img src="${esc(p.imagens[0])}" alt="">` : '<div class="mini"></div>'}
      <div class="t"><b>${esc(p.nome)}</b><small>${ehGB(p) ? (temValor(p) ? num(p.valor) + ' GB' : '') : temValor(p) ? brl(p.valor) + ' cada' : 'Sob consulta'}</small></div>
      ${ehGB(p) ? `<button class="rm" data-a="x" data-id="${esc(p.id)}" aria-label="Remover">✕</button>` : botao(p)}
    </div>`).join('');
  if (!n && aberta) fechar();
}

function abrir() { $('gaveta').classList.add('on'); $('fundo').classList.add('on'); $('barra').classList.remove('on'); }
function fechar() { $('gaveta').classList.remove('on'); $('fundo').classList.remove('on'); atualizar(); }
$('abrir').onclick = abrir;
$('fechar').onclick = fechar;
$('fundo').onclick = fechar;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('gaveta').classList.contains('on')) fechar(); });
$('limpar').onclick = () => { sel = {}; gravar('catalogo-selecao', sel); render(); atualizar(); };

$('enviar').onclick = () => {
  const it = itensSel(); if (!it.length) return;
  const nome = $('nome').value.trim(), obs = $('obs').value.trim();
  gravar('catalogo-nome', nome);
  const linhas = it.map(({p, q}) => {
    if (ehGB(p)) return `• ${p.nome}${temValor(p) ? ' — ' + num(p.valor) + ' GB' : ''}`;
    return `• ${q}x ${p.nome} — ${temValor(p) ? brl(p.valor * q) : 'sob consulta'}`;
  });
  const t = somas(it);
  let msg = `Olá! Vim pelo catálogo${loja.nome ? ' da ' + loja.nome : ''} e tenho interesse em:\n\n${linhas.join('\n')}\n\n`;
  if (t.reais) msg += `Total estimado: ${brl(t.reais)}${t.cons ? ' (+ itens sob consulta)' : ''}\n`;
  if (t.gb) msg += `Total em GB: ${num(t.gb)} GB\n`;
  if (nome) msg += `Nome: ${nome}\n`;
  if (obs) msg += `Obs.: ${obs}\n`;
  let fone = String(loja.whatsapp || '').replace(/\D/g, '');
  if (fone && fone.length <= 11) fone = '55' + fone;
  window.open(`https://wa.me/${fone}?text=${encodeURIComponent(msg.trim())}`, '_blank');
};

iniciar();
</script>
</body>
</html>
