<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<title>Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{
  --bg:#07090f;--card:#101624;--txt:#eef2fa;--mut:#8592aa;--azul:#2b8cff;--verm:#ff2d55;--zap:#25d366;
  --sobre-azul:#fff;--sobre-verm:#fff;
  --f-tit:"Barlow Condensed","Arial Narrow",sans-serif;--f-txt:Barlow,system-ui,sans-serif;
  --esc-tit:1;--esc-txt:1;--logo-h:140px;
  --bg2:color-mix(in srgb,var(--bg) 55%,var(--card));
  --line:color-mix(in srgb,var(--txt) 12%,var(--card));
  --azul2:color-mix(in srgb,var(--azul) 65%,var(--txt));
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;font-size:calc(16px * var(--esc-txt))}
body{position:relative;background:var(--bg);color:var(--txt);font:1rem/1.45 var(--f-txt);min-height:100vh;padding-bottom:120px;
  background-image:radial-gradient(900px 420px at 90% -10%,color-mix(in srgb,var(--azul) 18%,transparent),transparent 60%),radial-gradient(700px 360px at -10% 0%,color-mix(in srgb,var(--verm) 12%,transparent),transparent 60%);background-attachment:fixed}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.palco-topo{position:relative;overflow-x:clip}
/* o topo é desenhado numa largura fixa (390 px no celular, 1100 px no computador) e depois ampliado/reduzido por igual,
   para ficar idêntico ao que foi montado no painel em qualquer tela */
header.wrap{position:relative;padding-top:26px;padding-bottom:18px;margin:0;max-width:none;width:1100px;transform-origin:0 0}
:root{--marca-px:68px}
@media (max-width:699px){:root{--marca-px:42px}}
/* logo */
.logo{display:block;height:auto;max-height:var(--logo-h);max-width:min(100%,calc(var(--logo-h) * 4));object-fit:contain;margin-bottom:12px}
/* posições dos itens do topo (definidas no painel) */
header.wrap>.centro{margin-left:auto;margin-right:auto}
header.wrap>.direita{margin-left:auto}
header.wrap>.livre{position:absolute;margin:0;z-index:4;max-width:calc(100% - 32px)}
.logo.livre{max-width:min(calc(100% - 32px),calc(var(--logo-h) * 4))}
/* textos (o tamanho de cada um pode ser ajustado no painel: --e-*) */
.marca{font-family:var(--f-tit);font-style:italic;font-weight:800;text-transform:uppercase;font-size:calc(var(--marca-px) * var(--esc-tit) * var(--e-marca,1));line-height:.95;text-shadow:0 0 20px color-mix(in srgb,var(--azul) 55%,transparent)}
.marca span{color:var(--verm);font-size:calc(1em * var(--e-marca2,1));text-shadow:0 0 20px color-mix(in srgb,var(--verm) 60%,transparent)}
.slogan{color:var(--mut);margin-top:10px;max-width:560px;font-size:calc(1rem * var(--e-slogan,1))}
.insta{display:block;width:fit-content;margin-top:10px;color:var(--azul2);text-decoration:none;font-weight:700;font-size:calc(.875rem * var(--e-insta,1))}
/* filtros e navegação */
.filtros{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 0}
.campo-busca{position:relative}
.campo-busca svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mut)}
.busca{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 40px;outline:none}
.busca:focus{border-color:var(--azul);box-shadow:0 0 0 3px color-mix(in srgb,var(--azul) 20%,transparent)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none;align-items:center;scroll-behavior:smooth}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:7px 15px;font-weight:700;font-size:calc(.875rem * var(--e-categorias,1));cursor:pointer;white-space:nowrap}
.chip.on{background:var(--azul);border-color:var(--azul);color:var(--sobre-azul);box-shadow:0 0 14px color-mix(in srgb,var(--azul) 50%,transparent)}
.trilha{margin-top:8px}
.trilha .chip{padding:5px 12px;font-size:calc(.8125rem * var(--e-categorias,1));background:transparent}
.trilha .chip.on{background:color-mix(in srgb,var(--azul) 18%,transparent);color:var(--azul2);box-shadow:none;border-color:var(--azul)}
.trilha .chip.on:not(.abrir-lista)::after{content:" ✕";font-size:.8em;opacity:.6}
.abrir-lista{border-style:dashed !important}
.abrir-lista.on{border-style:solid !important}
.lista-sub{position:absolute;left:16px;top:100%;min-width:140px;max-width:min(300px,calc(100vw - 24px));max-height:min(50vh,340px);overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.55);z-index:6;padding:3px}
.lista-sub[hidden]{display:none}
.sub-item{width:100%;display:flex;align-items:center;gap:6px;text-align:left;background:none;border:0;border-radius:7px;padding:6px 9px;cursor:pointer;color:var(--txt);white-space:nowrap}
.sub-item:hover{background:color-mix(in srgb,var(--azul) 14%,transparent)}
.sub-item b{font-weight:700;font-size:calc(.8125rem * var(--e-categorias,1));overflow:hidden;text-overflow:ellipsis}
.sub-item small{color:var(--mut);font-size:.6875rem}
.sub-item i{font-style:normal;color:var(--azul2);font-weight:800;margin-left:auto;padding-left:8px}
.seta-cam{flex:none;color:var(--azul2);font-weight:800;font-size:1.1rem;line-height:1}
/* seções */
.sec-tit{font-family:var(--f-tit);font-style:italic;font-weight:800;text-transform:uppercase;font-size:calc(30px * var(--esc-tit) * var(--e-secao,1));margin:26px 0 2px;display:flex;align-items:center;gap:12px}
.sec-tit::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--azul),transparent)}
.sub-tit{font-size:calc(.8125rem * var(--e-subsecao,1));font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--azul2);margin:16px 0 0}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:12px 0 4px}
@media(min-width:700px){.grade{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}}
/* card */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,box-shadow .2s,transform .15s;cursor:pointer}
.card:hover{border-color:color-mix(in srgb,var(--azul) 50%,var(--line))}
.card.sel{border-color:var(--azul);box-shadow:0 0 0 1px var(--azul),0 0 22px color-mix(in srgb,var(--azul) 25%,transparent)}
.card.off{opacity:.55}
.foto{aspect-ratio:1;background:color-mix(in srgb,var(--card) 80%,#000);position:relative;overflow:hidden}
.foto>img{width:100%;height:100%;object-fit:cover;display:block}
.slides{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.slides::-webkit-scrollbar{display:none}
.slides img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start}
.pontos{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.pontos i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);box-shadow:0 0 3px rgba(0,0,0,.5);transition:.2s}
.pontos i.on{background:#fff;width:16px;border-radius:3px}
.seta{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:20px;line-height:1;cursor:pointer;opacity:0;transition:opacity .2s}
.seta.esq{left:6px}.seta.dir{right:6px}
@media(hover:hover){.foto:hover .seta{opacity:1}}
.semfoto{width:100%;height:100%;display:grid;place-items:center;font:italic 800 44px var(--f-tit);color:color-mix(in srgb,var(--txt) 18%,var(--card));background:linear-gradient(135deg,var(--bg2),var(--card))}
.tag{position:absolute;top:8px;left:8px;z-index:1;background:#2a3247;color:#fff;font:700 .6875rem/1 var(--f-txt);letter-spacing:.5px;text-transform:uppercase;padding:5px 8px;border-radius:6px}
.n-fotos{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:.6875rem;font-weight:700;padding:4px 7px;border-radius:6px;z-index:1}
.info{padding:12px 12px 10px;display:flex;flex-direction:column;gap:5px;flex:1}
.nome{font-family:var(--f-tit);font-weight:800;font-size:calc(1.25rem * var(--e-nome,1));line-height:1.1}
.desc{color:var(--mut);font-size:calc(.875rem * var(--e-desc,1))}
.card .desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.opcoes{list-style:none;display:flex;flex-direction:column;gap:3px;margin-top:2px}
.opcoes li{display:flex;gap:6px;align-items:flex-start;font-size:calc(.8125rem * var(--e-opcoes,1));font-weight:700;color:var(--azul2);line-height:1.25}
.opcoes li::before{content:"✓";flex:none;width:1.15em;height:1.15em;border-radius:50%;background:color-mix(in srgb,var(--azul) 22%,transparent);color:var(--azul2);display:grid;place-items:center;font-size:.75em;margin-top:.05em}
.preco{font-family:var(--f-tit);font-weight:800;font-size:calc(1.4375rem * var(--e-preco,1));margin-top:auto;padding-top:6px}
.preco.gb{color:var(--azul2);font-size:calc(1.4375rem * var(--e-gb,1))}
.preco.cons{font-family:var(--f-txt);font-weight:600;font-size:calc(.9375rem * var(--e-preco,1));color:var(--mut);padding-top:8px}
.mais{font-size:.75rem;color:var(--mut);font-weight:600}
.acao{padding:0 12px 12px}
.btn-add{width:100%;border:1px solid var(--azul);background:transparent;color:var(--azul2);border-radius:10px;padding:10px;font-weight:700;cursor:pointer}
.btn-add:hover{background:color-mix(in srgb,var(--azul) 12%,transparent)}
.btn-add.on{background:var(--azul);color:var(--sobre-azul)}
.btn-add:disabled{border-color:var(--line);color:var(--mut);cursor:default;background:none}
.qtd{display:flex;align-items:center;justify-content:space-between;background:var(--azul);color:var(--sobre-azul);border-radius:10px;overflow:hidden}
.qtd button{background:none;border:0;width:44px;height:40px;font-size:22px;font-weight:700;cursor:pointer;color:inherit}
.qtd button:active{background:rgba(255,255,255,.15)}
.qtd span{font-weight:700}
.vazio{text-align:center;color:var(--mut);padding:50px 10px}
.rodape{border-top:1px solid var(--line);margin-top:30px;padding:22px 0;color:var(--mut);font-size:calc(.875rem * var(--e-rodape,1));white-space:pre-line}
.rodape:empty{display:none}
/* janela de detalhes do produto */
.det{margin:auto;border:1px solid var(--line);border-radius:18px;background:var(--bg2);color:var(--txt);width:min(860px,94vw);max-height:92vh;max-height:92dvh;padding:0;overflow:hidden}
.det::backdrop{background:rgba(0,0,0,.7)}
.det[open]{display:grid;grid-template-columns:1fr 1fr}
.det .foto{aspect-ratio:auto;min-height:100%;max-height:92dvh}
.det .foto .semfoto{font-size:80px}
.det .seta{opacity:1}
.det-corpo{display:flex;flex-direction:column;gap:10px;padding:22px;overflow:auto;max-height:92dvh}
.det .nome{font-size:calc(1.9rem * var(--e-nome,1))}
.det .desc{white-space:pre-line;line-height:1.55;font-size:calc(.98rem * var(--e-desc,1))}
.det .opcoes li{font-size:calc(.95rem * var(--e-opcoes,1))}
.det .preco{font-size:calc(2rem * var(--e-preco,1));margin-top:4px}
.det .preco.gb{font-size:calc(2rem * var(--e-gb,1))}
.det .cat-cam{font-size:.75rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--azul2)}
.det-fechar{position:absolute;top:10px;right:10px;z-index:3;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:22px;cursor:pointer}
.det .acao{padding:0}
.extra{margin-top:8px;border-top:1px solid var(--line);padding-top:12px}
.extra-tit{font-family:var(--f-tit);font-weight:800;font-size:1.15rem;margin-bottom:8px}
.extra-tit small{color:var(--mut);font-family:var(--f-txt);font-size:.75rem;font-weight:600}
.extra-busca{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none;margin-bottom:6px}
.extra-busca:focus{border-color:var(--azul)}
.extra-lista{display:flex;flex-direction:column;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.extra-item{display:flex;align-items:center;gap:10px;padding:7px 9px}
.extra-item+.extra-item{border-top:1px solid var(--line)}
.extra-item[hidden]{display:none}
.extra-item.off{opacity:.5}
.extra-item img,.extra-item .mini{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none;background:var(--card)}
.extra-item .t{flex:1;min-width:0}
.extra-item .t b{display:block;font-size:.875rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.extra-item .t small{color:var(--mut);font-size:.75rem}
.acao-mini{flex:none}
.acao-mini .btn-add{width:auto;padding:7px 12px;font-size:.8125rem}
.acao-mini .qtd{width:100px}
.acao-mini .qtd button{width:32px;height:32px;font-size:18px}
.det-resumo{position:sticky;bottom:0;margin:6px -22px -22px;padding:10px 22px calc(10px + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.det-resumo[hidden]{display:none}
.det-resumo .b-info small{color:var(--mut)}
.det-resumo button{flex:none;border:0;border-radius:10px;background:var(--azul);color:var(--sobre-azul);font-weight:700;padding:9px 14px;cursor:pointer}
@media(max-width:700px){.det-resumo{margin:6px -18px -18px;padding-left:18px;padding-right:18px}}
.det .acao .btn-add{padding:13px;font-size:1rem}
@media(max-width:700px){
  .det{width:100vw;max-width:100vw;max-height:94dvh;margin:auto 0 0;border-radius:20px 20px 0 0;border-bottom:0}
  .det[open]{display:flex;flex-direction:column;overflow:auto}
  .det .foto{aspect-ratio:1;min-height:0;flex:none}
  .det-corpo{overflow:visible;max-height:none;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
}
/* barra e gaveta da seleção */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,color-mix(in srgb,var(--bg) 96%,transparent) 35%);transform:translateY(130%);transition:transform .25s}
.barra.on{transform:none}
.b-info{display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap;min-width:0;text-align:left}
.b-info small{font-weight:600;opacity:.85;font-size:.8125rem}
.b-info b{font-size:1rem;white-space:nowrap}
.b-info b+b::before{content:"+";margin-right:6px;opacity:.6;font-weight:600}
.barra button>span:last-child{white-space:nowrap;flex:none}
.barra button{max-width:560px;margin:0 auto;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--azul);color:var(--sobre-azul);border:0;border-radius:14px;padding:15px 18px;font-weight:700;cursor:pointer;box-shadow:0 8px 30px color-mix(in srgb,var(--azul) 45%,transparent)}
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.fundo.on{opacity:1;pointer-events:auto}
.gaveta{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:90vh;max-height:90dvh;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .25s;display:flex;flex-direction:column;max-width:620px;margin:0 auto}
.gaveta.on{transform:none}
.g-topo{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.g-topo h2{font-family:var(--f-tit);font-style:italic;font-weight:800;font-size:1.625rem;text-transform:uppercase}
.fechar{background:none;border:0;font-size:30px;line-height:1;cursor:pointer;color:var(--mut);width:40px;height:40px}
.g-corpo{overflow:auto;padding:6px 18px 14px}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item img,.item .mini{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;background:var(--card)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--mut)}
.item .qtd{width:112px;flex:none}
.item .qtd button{width:36px;height:34px;font-size:18px}
.item .rm{flex:none;border:1px solid var(--line);background:none;border-radius:8px;width:36px;height:34px;color:var(--mut);cursor:pointer;font-size:16px}
.campo{margin-top:14px}
.campo label{display:block;font-size:.8125rem;color:var(--mut);margin-bottom:6px;font-weight:600}
.campo input,.campo textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none;resize:vertical}
.campo input:focus,.campo textarea:focus{border-color:var(--azul)}
.g-pe{padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.total span{flex:1;min-width:0}
.total b{font-family:var(--f-tit);font-size:clamp(1.05rem,5vw,1.5rem);white-space:nowrap;text-align:right}
.total.gb b{color:var(--azul2)}
.aviso-c{font-size:.8125rem;color:var(--mut);text-align:right}
.zap{width:100%;margin-top:12px;border:0;border-radius:14px;padding:15px;background:var(--zap);color:#04290f;font-weight:800;font-size:1rem;cursor:pointer;display:flex;gap:10px;justify-content:center;align-items:center}
.limpar{display:block;margin:10px auto 0;background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:.875rem}
/* modo pré-visualização do painel */
body.previa .editavel:hover{outline:1px dashed var(--azul2);outline-offset:2px;cursor:pointer}
.camada-edit{position:absolute;inset:0;pointer-events:none;z-index:7}
.caixa{position:absolute;border:1.5px dashed color-mix(in srgb,var(--azul2) 75%,transparent);border-radius:4px;pointer-events:auto;cursor:move;touch-action:none;user-select:none}
.caixa:hover,.caixa.ativa{background:color-mix(in srgb,var(--azul) 10%,transparent);border-style:solid;border-color:var(--azul)}
.caixa-rot{position:absolute;left:-1px;top:-17px;font:700 10px/1 system-ui,sans-serif;background:var(--azul);color:#fff;padding:3px 6px;border-radius:4px 4px 0 0;opacity:.85;white-space:nowrap}
.alca{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;background:var(--azul);border:2px solid #fff;border-radius:3px;cursor:nwse-resize;touch-action:none}
body.previa .logo{-webkit-user-drag:none;user-select:none}
</style>
</head>
<body>
<div class="palco-topo" id="palco"><header class="wrap">
  <img class="logo" id="logo" alt="" hidden draggable="false">
  <h1 class="marca" id="marca"></h1>
  <p class="slogan" id="slogan"></p>
  <a class="insta" id="insta" target="_blank" rel="noopener" hidden></a>
</header></div>

<div class="filtros"><div class="wrap">
  <div class="campo-busca">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input class="busca" id="busca" type="search" placeholder="Buscar produto…" aria-label="Buscar produto">
  </div>
  <nav id="niveis" aria-label="Categorias"></nav>
</div>
<div class="lista-sub" id="lista-sub" hidden></div>
</div>

<main class="wrap">
  <div id="conteudo"><p class="vazio">Carregando…</p></div>
  <footer class="rodape" id="rodape"></footer>
</main>

<dialog class="det" id="det" aria-label="Detalhes do produto"></dialog>

<div class="barra" id="barra"><button id="abrir"><span class="b-info" id="b-qtd"></span><span>Ver seleção →</span></button></div>
<div class="fundo" id="fundo"></div>
<aside class="gaveta" id="gaveta" aria-label="Sua seleção">
  <div class="g-topo"><h2>Sua seleção</h2><button class="fechar" id="fechar" aria-label="Fechar">×</button></div>
  <div class="g-corpo">
    <div id="lista"></div>
    <div class="campo"><label for="nome">Seu nome</label><input id="nome" autocomplete="name" placeholder="Como podemos te chamar?"></div>
    <div class="campo"><label for="obs">Observação (opcional)</label><textarea id="obs" rows="2" placeholder="Ex.: modelo do console, forma de pagamento…"></textarea></div>
  </div>
  <div class="g-pe">
    <div id="totais"></div>
    <button class="zap" id="enviar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.3-4.4A9 9 0 1 1 21 12z"/></svg>
      Enviar pelo WhatsApp
    </button>
    <button class="limpar" id="limpar">Limpar seleção</button>
  </div>
</aside>

<script src="comum.js?v=9"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => Number(v).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const num = v => Number(v).toLocaleString('pt-BR', {maximumFractionDigits: 2});
const iniciais = n => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const ler = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch (e) { return d } };
const gravar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} };
const ehGB = p => p.unidade === 'GB';
const temValor = p => typeof p.valor === 'number' && isFinite(p.valor);
const PREVIA = new URLSearchParams(location.search).has('previa');

let loja = {}, categorias = [], etiquetas = [], produtos = [], caminhoSel = [], termo = '';
let sel = ler('catalogo-selecao', {});
let detalheId = null;
const mapa = () => new Map(percorrer(categorias).map(x => [x.no.id, x]));
const nomesOpcoes = p => etiquetas.filter(e => p.etiquetas.includes(e.id) && e.nome.trim()).map(e => e.nome);

function usarDados(d) {
  ({loja, categorias, etiquetas, produtos} = normalizarCatalogo(d));
  categorias = expandirArvore(categorias);
  const m = mapa();
  const i = caminhoSel.findIndex(id => !m.has(id));
  if (i >= 0) caminhoSel = caminhoSel.slice(0, i);
  for (const id in sel) {
    const p = produtos.find(x => x.id === id);
    if (!p || !p.disponivel) delete sel[id];
    else if (ehGB(p)) sel[id] = 1;
  }
  if (!PREVIA) gravar('catalogo-selecao', sel);
  aplicarTema(loja.tema); cabecalho(); niveis(); render(); atualizar();
  if (detalheId) { const p = produtos.find(x => x.id === detalheId); p ? abrirDetalhe(p) : $('det').close(); }
}

async function iniciar() {
  $('nome').value = ler('catalogo-nome', '');
  if (PREVIA) {
    document.body.classList.add('previa');
    window.addEventListener('message', e => {
      if (e.origin === location.origin && e.data && e.data.tipo === 'catalogo-previa') usarDados(e.data.dados);
    });
    parent.postMessage({tipo: 'catalogo-pronto'}, location.origin);
    return;
  }
  try {
    const r = await fetch('data/produtos.json?v=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) throw new Error(r.status);
    usarDados(await r.json());
  } catch (e) {
    $('conteudo').innerHTML = '<p class="vazio">Não foi possível carregar o catálogo agora. Tente novamente em instantes.</p>';
  }
}

// ---------- topo ----------
const mqCel = matchMedia(`(max-width: ${LARGURA_CELULAR}px)`);
const dispositivo = () => mqCel.matches ? 'cel' : 'pc';
const posicoesAtuais = () => { const P = loja.tema.posicoes; return (mqCel.matches && P.cel) ? P.cel : P.pc; };
const CLASSE_BASE = {logo: 'logo', marca: 'marca', slogan: 'slogan', insta: 'insta'};
const ALINHA = {esquerda: 'left', centro: 'center', direita: 'right'};
// No modo livre: x = % da largura do conteúdo (0 = encostado à esquerda, 100 = à direita); y = px a partir do topo do cabeçalho.
function aplicarPos(k, p) {
  const el = $(k), st = el.style;
  el.className = CLASSE_BASE[k] + ' ' + p.modo + (el.classList.contains('editavel') ? ' editavel' : '');
  st.left = st.top = st.transform = st.width = st.textAlign = st.minHeight = '';
  if (k === 'logo') el.parentElement.style.setProperty('--logo-h', p.h + 'px');
  else {
    if (p.w) st.width = p.w + 'px';
    if (p.hc) st.minHeight = p.hc + 'px';
    st.textAlign = ALINHA[p.modo === 'livre' ? p.al : p.modo];
  }
  if (p.modo === 'livre') {
    st.left = `calc(16px + (100% - 32px) * ${p.x / 100})`;
    st.top = p.y + 'px';
    st.transform = `translateX(-${p.x}%)`;
  }
}
function posicionarTopo(ps = posicoesAtuais()) {
  for (const e of ELEM_TOPO) aplicarPos(e.k, ps[e.k]);
  ajustarTopo();
}
// o cabeçalho cresce para os itens livres nunca ficarem escondidos atrás da busca
let escTopo = 1;
function escalarTopo() {
  const palco = $('palco'), h = $('logo').parentElement, W = palco.clientWidth;
  const cel = mqCel.matches, design = cel ? 390 : 1100;
  escTopo = cel ? W / design : Math.min(1, W / design);
  h.style.width = design + 'px';
  h.style.transform = escTopo === 1 ? '' : `scale(${escTopo})`;
  h.style.marginLeft = Math.max(0, (W - design * escTopo) / 2) + 'px';
  palco.style.height = Math.ceil(h.offsetHeight * escTopo) + 'px';
}
function ajustarTopo() {
  const h = $('logo').parentElement;
  h.style.minHeight = '';
  let fundo = 0;
  for (const e of ELEM_TOPO) {
    const el = $(e.k);
    if (!el.hidden && el.classList.contains('livre')) fundo = Math.max(fundo, el.offsetTop + el.offsetHeight + 16);
  }
  if (fundo) h.style.minHeight = fundo + 'px';
  escalarTopo();
  atualizarCaixas();
}
function atualizarCaixas() {}      // substituída na pré-visualização do painel
$('logo').addEventListener('load', ajustarTopo);
mqCel.addEventListener('change', () => { if (loja.tema) posicionarTopo(); });
if (document.fonts) document.fonts.ready.then(() => { if (loja.tema) ajustarTopo(); });
addEventListener('resize', () => { if (loja.tema) ajustarTopo(); });
function cabecalho() {
  const nome = loja.nome || 'Catálogo';
  document.title = nome + ' · Catálogo';
  $('logo').hidden = !loja.logo;
  if (loja.logo) { if ($('logo').getAttribute('src') !== loja.logo) $('logo').src = loja.logo; $('logo').alt = nome; }
  $('marca').hidden = !!(loja.logo && loja.ocultarNome);
  const partes = esc(nome).split(' ');
  $('marca').innerHTML = partes.length > 1 ? partes.slice(0, -1).join(' ') + ' <span>' + partes[partes.length - 1] + '</span>' : partes[0];
  $('slogan').textContent = loja.slogan || '';
  const u = String(loja.instagram || '').replace(/^@/, '');
  $('insta').hidden = !u;
  if (u) { $('insta').href = 'https://instagram.com/' + encodeURIComponent(u); $('insta').textContent = '@' + u + ' no Instagram'; }
  $('rodape').textContent = loja.rodape || '';
  posicionarTopo();
}

// ---------- navegação: categorias numa linha, subcategorias numa segunda linha com o caminho ----------
let listaAberta = false;
const contarNo = no => { const ids = new Set(origensDe(no)); return produtos.filter(p => ids.has(p.categoria)).length; };
const itens = n => n === 1 ? '1 item' : n + ' itens';
function niveis() {
  if (!categorias.length) { $('niveis').innerHTML = ''; $('lista-sub').hidden = true; return; }
  const m = mapa(), raiz = caminhoSel[0] || '';
  let html = '<div class="chips" id="linha-raiz">' +
    [{id: '', nome: 'Todos'}, ...categorias].map(c =>
      `<button class="chip${c.id === raiz ? ' on' : ''}" data-raiz="${esc(c.id)}">${esc(c.nome || 'Sem nome')}</button>`).join('') + '</div>';
  if (raiz) {
    const subs = caminhoSel.slice(1);
    const atual = m.get(caminhoSel[caminhoSel.length - 1]).no;
    if (subs.length || atual.filhas.length) {
      const partes = subs.map((id, i) => `<button class="chip on" data-volta="${i}" title="Voltar">${esc(m.get(id).no.nome || 'Sem nome')}</button>`);
      let trilha = partes.join('<span class="seta-cam">›</span>');
      if (atual.filhas.length) {
        if (partes.length) trilha += '<span class="seta-cam">›</span>';
        trilha += `<button class="chip abrir-lista${listaAberta ? ' on' : ''}" data-lista aria-expanded="${listaAberta}">Subcategorias (${atual.filhas.length}) ${listaAberta ? '▴' : '▾'}</button>`;
      }
      html += `<div class="chips trilha" id="trilha">${trilha}</div>`;
    }
    // lista vertical com as subcategorias do nível atual
    if (atual.filhas.length && listaAberta) {
      $('lista-sub').innerHTML = atual.filhas.map(f => `<button class="sub-item" data-desce="${esc(f.id)}"><b>${esc(f.nome || 'Sem nome')}</b><small>(${contarNo(f)})</small>${f.filhas.length ? '<i>›</i>' : ''}</button>`).join('');
      $('lista-sub').hidden = false;
      $('lista-sub').scrollTop = 0;
    } else $('lista-sub').hidden = true;
  } else $('lista-sub').hidden = true;
  $('niveis').innerHTML = html;
  const t = $('trilha'); if (t) { t.style.scrollBehavior = 'auto'; t.scrollLeft = t.scrollWidth; t.style.scrollBehavior = ''; }
  const on = $('linha-raiz').querySelector('.on');
  if (on) on.scrollIntoView({block: 'nearest', inline: 'nearest'});
  ['linha-raiz', 'trilha'].forEach(id => { const r = $(id); if (r) r.addEventListener('scroll', posicionarLista, {passive: true}); });
  posicionarLista();
}
// a lista abre logo abaixo da categoria (ou subcategoria) escolhida por último
function posicionarLista() {
  const l = $('lista-sub'); if (l.hidden) return;
  const volta = document.querySelectorAll('#trilha [data-volta]');
  const anc = volta.length ? volta[volta.length - 1] : document.querySelector('#linha-raiz .chip.on');
  if (!anc) return;
  const f = l.parentElement.getBoundingClientRect(), r = anc.getBoundingClientRect();
  const maxL = Math.max(8, f.width - l.offsetWidth - 8);
  l.style.left = Math.min(Math.max(8, r.left - f.left), maxL) + 'px';
  l.style.top = (r.bottom - f.top + 4) + 'px';
}
addEventListener('resize', posicionarLista);
function navegar(e) {
  const b = e.target.closest('button'); if (!b) return;
  if ('lista' in b.dataset) { listaAberta = !listaAberta; niveis(); return; }
  if ('fecharLista' in b.dataset) { listaAberta = false; niveis(); return; }
  if ('raiz' in b.dataset) caminhoSel = b.dataset.raiz ? [b.dataset.raiz] : [];
  else if ('volta' in b.dataset) caminhoSel = caminhoSel.slice(0, +b.dataset.volta + 1);
  else if ('desce' in b.dataset) caminhoSel = [...caminhoSel, b.dataset.desce];
  else return;
  // abre a lista vertical sempre que o nível escolhido tiver subcategorias
  const atual = caminhoSel.length ? mapa().get(caminhoSel[caminhoSel.length - 1]).no : null;
  listaAberta = !!(atual && atual.filhas.length);
  niveis(); render(); manterNoTopo();
}
$('niveis').addEventListener('click', navegar);
$('lista-sub').addEventListener('click', navegar);
document.addEventListener('click', e => {
  // usa o caminho original do clique (o botão clicado pode ter sido redesenhado)
  if (listaAberta && !e.composedPath().some(el => el.id === 'lista-sub' || el.id === 'niveis')) { listaAberta = false; niveis(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && listaAberta) { listaAberta = false; niveis(); } });
function manterNoTopo() {
  const y = $('conteudo').getBoundingClientRect().top + scrollY - $('niveis').closest('.filtros').offsetHeight - 8;
  if (scrollY > y) scrollTo({top: y});
}
$('busca').addEventListener('input', e => { termo = norm(e.target.value); render(); });

// ---------- cards ----------
function textoValor(p) {
  if (ehGB(p)) return temValor(p) ? `<div class="preco gb">${num(p.valor)} GB</div>` : '';
  return temValor(p) ? `<div class="preco">${brl(p.valor)}</div>` : '<div class="preco cons">Preço sob consulta</div>';
}
function botao(p) {
  if (!p.disponivel) return '<button class="btn-add" disabled>Indisponível</button>';
  const q = sel[p.id] || 0, id = esc(p.id);
  if (ehGB(p)) return q ? `<button class="btn-add on" data-a="x" data-id="${id}">✓ Selecionado</button>` : `<button class="btn-add" data-a="+" data-id="${id}">Selecionar</button>`;
  return q
    ? `<div class="qtd"><button data-a="-" data-id="${id}" aria-label="Diminuir">−</button><span>${q}</span><button data-a="+" data-id="${id}" aria-label="Aumentar">+</button></div>`
    : `<button class="btn-add" data-a="+" data-id="${id}">Selecionar</button>`;
}
function fotos(p) {
  const im = p.imagens, alt = esc(p.nome);
  if (!im.length) return `<div class="semfoto">${esc(iniciais(p.nome))}</div>`;
  if (im.length === 1) return `<img src="${esc(im[0])}" alt="${alt}" loading="lazy">`;
  return `<div class="slides">${im.map((s, i) => `<img src="${esc(s)}" alt="${alt} — foto ${i + 1}" loading="lazy">`).join('')}</div>
    <span class="n-fotos">${im.length} fotos</span>
    <button class="seta esq" data-seta="-1" aria-label="Foto anterior">‹</button>
    <button class="seta dir" data-seta="1" aria-label="Próxima foto">›</button>
    <div class="pontos">${im.map((_, i) => `<i${i ? '' : ' class="on"'}></i>`).join('')}</div>`;
}
const listaOpcoes = p => { const o = nomesOpcoes(p); return o.length ? `<ul class="opcoes">${o.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''; };
function card(p) {
  return `
    <article class="card${sel[p.id] ? ' sel' : ''}${p.disponivel ? '' : ' off'}" data-id="${esc(p.id)}" tabindex="0" aria-label="Ver detalhes de ${esc(p.nome)}">
      <div class="foto">${fotos(p)}${p.disponivel ? '' : '<span class="tag">Esgotado</span>'}</div>
      <div class="info">
        <h3 class="nome">${esc(p.nome)}</h3>
        ${p.descricao ? `<p class="desc">${esc(p.descricao)}</p>` : ''}
        ${listaOpcoes(p)}
        ${textoValor(p)}
      </div>
      <div class="acao" data-acao-de="${esc(p.id)}">${botao(p)}</div>
    </article>`;
}
function ligarSlides(raiz) {
  raiz.querySelectorAll('.slides').forEach(el => el.addEventListener('scroll', () => {
    const i = Math.round(el.scrollLeft / el.clientWidth);
    el.parentElement.querySelectorAll('.pontos i').forEach((d, k) => d.classList.toggle('on', k === i));
  }, {passive: true}));
}

// Mostra uma categoria: primeiro os itens dela, depois cada subcategoria com o caminho como subtítulo.
function blocoNo(no, lista, rotulo) {
  let html = '';
  const diretos = lista.filter(p => no.origens.includes(p.categoria));
  if (diretos.length) html += (rotulo ? `<h3 class="sub-tit">${esc(rotulo)}</h3>` : '') + `<div class="grade">${diretos.map(card).join('')}</div>`;
  for (const f of no.filhas) html += blocoNo(f, lista, rotulo ? rotulo + ' › ' + f.nome : f.nome);
  return html;
}
function render() {
  const m = mapa(), atual = caminhoSel.length ? m.get(caminhoSel[caminhoSel.length - 1]).no : null;
  const permitidos = atual ? new Set(origensDe(atual)) : null;
  const lista = produtos.filter(p => (!permitidos || permitidos.has(p.categoria)) &&
    (!termo || norm(p.nome + ' ' + p.descricao).includes(termo)));
  if (!lista.length) {
    $('conteudo').innerHTML = `<p class="vazio">${termo ? 'Nenhum produto encontrado.' : atual ? 'Ainda não há produtos nesta categoria.' : 'Nenhum produto ainda.'}</p>`;
    return;
  }
  let html = '';
  if (atual) html = blocoNo(atual, lista, '');
  else {
    for (const c of categorias) {
      const ids = new Set(origensDe(c));
      if (lista.some(p => ids.has(p.categoria))) html += `<section><h2 class="sec-tit">${esc(c.nome)}</h2>${blocoNo(c, lista, '')}</section>`;
    }
    const outros = lista.filter(p => !m.has(p.categoria));
    if (outros.length) html += `<section>${html ? '<h2 class="sec-tit">Outros</h2>' : ''}<div class="grade">${outros.map(card).join('')}</div></section>`;
  }
  $('conteudo').innerHTML = html;
  ligarSlides($('conteudo'));
}

// ---------- detalhes do produto ----------
function caminhoTexto(id) {
  const m = mapa(), nomes = [];
  let x = m.get(id);
  while (x) { nomes.unshift(x.no.nome); x = x.pai ? m.get(x.pai.id) : null; }
  return nomes.join(' › ');
}
// listas de "escolha junto" do produto: mostra só o nome da categoria final escolhida no painel
const valorCurto = q => ehGB(q) ? (temValor(q) ? num(q.valor) + ' GB' : '') : temValor(q) ? brl(q.valor) : 'Sob consulta';
function blocoExtras(p) {
  const m = mapa();
  return (p.extras || []).map(id => {
    const x = m.get(id); if (!x) return '';
    const ids = new Set(origensDe(x.no));
    const its = produtos.filter(q => q.id !== p.id && ids.has(q.categoria));
    if (!its.length) return '';
    return `<section class="extra">
      <h4 class="extra-tit">${esc(x.no.nome)} <small>(${its.length})</small></h4>
      ${its.length > 6 ? `<input class="extra-busca" type="search" placeholder="Buscar em ${esc(x.no.nome)}…" data-filtro-extra>` : ''}
      <div class="extra-lista">${its.map(q => `
        <div class="extra-item${q.disponivel ? '' : ' off'}" data-nome="${esc(norm(q.nome + ' ' + q.descricao))}">
          ${q.imagens[0] ? `<img src="${esc(q.imagens[0])}" alt="" loading="lazy">` : '<div class="mini"></div>'}
          <div class="t"><b>${esc(q.nome)}</b><small>${valorCurto(q)}</small></div>
          <div class="acao-mini" data-acao-de="${esc(q.id)}">${botao(q)}</div>
        </div>`).join('')}</div>
    </section>`;
  }).join('');
}
document.addEventListener('input', e => {
  if (!e.target.matches('[data-filtro-extra]')) return;
  const t = norm(e.target.value);
  e.target.parentElement.querySelectorAll('.extra-item').forEach(it => it.hidden = !!t && !it.dataset.nome.includes(t));
});
function infoSelecao(n, t) {
  return `<small>${n === 1 ? '1 item' : n + ' itens'}</small>` +
    (t.temR || !t.temGB ? `<b>${brl(t.reais)}</b>` : '') + (t.temGB ? `<b>${num(t.gb)} GB</b>` : '');
}
function abrirDetalhe(p) {
  detalheId = p.id;
  const d = $('det');
  d.innerHTML = `
    <button class="det-fechar" data-fechar-det aria-label="Fechar">×</button>
    <div class="foto">${fotos(p)}${p.disponivel ? '' : '<span class="tag">Esgotado</span>'}</div>
    <div class="det-corpo">
      ${p.categoria ? `<span class="cat-cam">${esc(caminhoTexto(p.categoria))}</span>` : ''}
      <h2 class="nome">${esc(p.nome)}</h2>
      ${textoValor(p)}
      ${listaOpcoes(p)}
      <div class="acao" data-acao-de="${esc(p.id)}">${botao(p)}</div>
      ${p.descricao ? `<p class="desc">${esc(p.descricao)}</p>` : ''}
      ${blocoExtras(p)}
      <div class="det-resumo" id="det-resumo" hidden></div>
    </div>`;
  atualizar();
  ligarSlides(d);
  if (!d.open) d.showModal();
}
$('det').addEventListener('click', e => {
  if (e.target === $('det') || e.target.closest('[data-fechar-det]')) $('det').close();
});
$('det').addEventListener('close', () => { detalheId = null; });
$('det').addEventListener('click', e => { if (e.target.closest('[data-ver-selecao]')) { $('det').close(); abrir(); } });

// ---------- cliques ----------
document.addEventListener('click', e => {
  const seta = e.target.closest('[data-seta]');
  if (seta) {
    const el = seta.parentElement.querySelector('.slides'), w = el.clientWidth, d = +seta.dataset.seta;
    if (d > 0 && el.scrollLeft + w >= el.scrollWidth - 2) el.scrollTo({left: 0, behavior: 'smooth'});
    else if (d < 0 && el.scrollLeft <= 2) el.scrollTo({left: el.scrollWidth, behavior: 'smooth'});
    else el.scrollBy({left: d * w, behavior: 'smooth'});
    return;
  }
  const b = e.target.closest('[data-a]');
  if (!b) {
    const c = e.target.closest('.card');
    if (c && !e.target.closest('button')) { const p = produtos.find(x => x.id === c.dataset.id); if (p) abrirDetalhe(p); }
    return;
  }
  const id = b.dataset.id, p = produtos.find(x => x.id === id);
  if (!p || !p.disponivel) return;
  let q = sel[id] || 0;
  if (b.dataset.a === 'x') q = 0;
  else q = ehGB(p) ? (b.dataset.a === '+' ? 1 : 0) : Math.max(0, q + (b.dataset.a === '+' ? 1 : -1));
  if (q) sel[id] = q; else delete sel[id];
  if (!PREVIA) gravar('catalogo-selecao', sel);
  document.querySelectorAll(`.card[data-id="${CSS.escape(id)}"]`).forEach(c => c.classList.toggle('sel', !!q));
  document.querySelectorAll(`[data-acao-de="${CSS.escape(id)}"]`).forEach(el => el.innerHTML = botao(p));
  atualizar();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('.card')) { const p = produtos.find(x => x.id === e.target.dataset.id); if (p) abrirDetalhe(p); }
});

// ---------- seleção ----------
function itensSel() {
  return Object.entries(sel).map(([id, q]) => ({p: produtos.find(x => x.id === id), q})).filter(x => x.p);
}
function somas(it) {
  let reais = 0, gb = 0, cons = 0, temR = false, temGB = false;
  it.forEach(({p, q}) => {
    if (ehGB(p)) { temGB = true; if (temValor(p)) gb += p.valor * q; }
    else if (temValor(p)) { temR = true; reais += p.valor * q; }
    else cons++;
  });
  return {reais, gb, cons, temR, temGB};
}
function atualizar() {
  const it = itensSel(), n = it.reduce((s, x) => s + x.q, 0), aberta = $('gaveta').classList.contains('on');
  const t = somas(it);
  $('barra').classList.toggle('on', n > 0 && !aberta);
  $('b-qtd').innerHTML = infoSelecao(n, t);
  const r = $('det-resumo');
  if (r) { r.hidden = !n; r.innerHTML = n ? `<span class="b-info">${infoSelecao(n, t)}</span><button data-ver-selecao>Ver seleção →</button>` : ''; }
  let tot = '';
  if (t.temR || !t.temGB) tot += `<div class="total"><span>Total estimado</span><b>${brl(t.reais)}</b></div>`;
  if (t.temGB) tot += `<div class="total gb"><span>Total em GB</span><b>${num(t.gb)} GB</b></div>`;
  if (t.cons) tot += `<p class="aviso-c">+ ${t.cons} ${t.cons === 1 ? 'item' : 'itens'} com preço sob consulta</p>`;
  $('totais').innerHTML = tot;
  $('lista').innerHTML = it.map(({p}) => `
    <div class="item">
      ${p.imagens[0] ? `<img src="${esc(p.imagens[0])}" alt="">` : '<div class="mini"></div>'}
      <div class="t"><b>${esc(p.nome)}</b><small>${ehGB(p) ? (temValor(p) ? num(p.valor) + ' GB' : '') : temValor(p) ? brl(p.valor) + ' cada' : 'Sob consulta'}</small></div>
      ${ehGB(p) ? `<button class="rm" data-a="x" data-id="${esc(p.id)}" aria-label="Remover">✕</button>` : `<div data-acao-de="${esc(p.id)}">${botao(p)}</div>`}
    </div>`).join('');
  if (!n && aberta) fechar();
}

function abrir() { $('gaveta').classList.add('on'); $('fundo').classList.add('on'); $('barra').classList.remove('on'); }
function fechar() { $('gaveta').classList.remove('on'); $('fundo').classList.remove('on'); atualizar(); }
$('abrir').onclick = abrir;
$('fechar').onclick = fechar;
$('fundo').onclick = fechar;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('gaveta').classList.contains('on')) fechar(); });
$('limpar').onclick = () => { sel = {}; if (!PREVIA) gravar('catalogo-selecao', sel); render(); atualizar(); };

$('enviar').onclick = () => {
  const it = itensSel(); if (!it.length) return;
  const nome = $('nome').value.trim(), obs = $('obs').value.trim();
  gravar('catalogo-nome', nome);
  const linhas = it.map(({p, q}) => {
    if (ehGB(p)) return `• ${p.nome}${temValor(p) ? ' — ' + num(p.valor) + ' GB' : ''}`;
    return `• ${q}x ${p.nome} — ${temValor(p) ? brl(p.valor * q) : 'sob consulta'}`;
  });
  const t = somas(it);
  let msg = `Olá! Vim pelo catálogo${loja.nome ? ' da ' + loja.nome : ''} e tenho interesse em:\n\n${linhas.join('\n')}\n\n`;
  if (t.reais) msg += `Total estimado: ${brl(t.reais)}${t.cons ? ' (+ itens sob consulta)' : ''}\n`;
  if (t.gb) msg += `Total em GB: ${num(t.gb)} GB\n`;
  if (nome) msg += `Nome: ${nome}\n`;
  if (obs) msg += `Obs.: ${obs}\n`;
  let fone = String(loja.whatsapp || '').replace(/\D/g, '');
  if (fone && fone.length <= 11) fone = '55' + fone;
  window.open(`https://wa.me/${fone}?text=${encodeURIComponent(msg.trim())}`, '_blank');
};

// ---------- recursos da pré-visualização do painel ----------
if (PREVIA) {
  // marca os textos editáveis e avisa o painel quando um deles é clicado
  const marcarEditaveis = () => TEXTOS.forEach(d => document.querySelectorAll(d.sel).forEach(el => el.classList.add('editavel')));
  new MutationObserver(marcarEditaveis).observe(document.body, {childList: true, subtree: true});
  document.addEventListener('click', e => {
    const d = TEXTOS.find(d => e.target.closest(d.sel));
    if (d) parent.postMessage({tipo: 'texto-clicado', chave: d.k}, location.origin);
  }, true);
  // ---------- caixas do topo: arrastar para mover, puxar o canto para redimensionar ----------
  const topo = $('logo').parentElement;
  const camada = document.createElement('div'); camada.className = 'camada-edit'; topo.appendChild(camada);
  const caixas = {};
  const largUtil = () => topo.clientWidth - 32;
  const xDe = (L, w) => { const W = largUtil(); return W > w ? Math.round(1000 * Math.min(Math.max(L, 0), W - w) / (W - w)) / 10 : 0; };
  const relTopo = el => {          // posição do elemento dentro do topo, nas medidas do desenho
    const hr = topo.getBoundingClientRect(), r = el.getBoundingClientRect(), s = escTopo;
    return {left: (r.left - hr.left) / s, top: (r.top - hr.top) / s, width: r.width / s, height: r.height / s};
  };
  atualizarCaixas = () => {
    for (const e of ELEM_TOPO) {
      const el = $(e.k);
      let c = caixas[e.k];
      if (!c) {
        c = document.createElement('div'); c.className = 'caixa'; c.dataset.el = e.k;
        c.innerHTML = `<span class="caixa-rot">${esc(e.nome)}</span><i class="alca" title="Puxe para mudar o tamanho"></i>`;
        camada.appendChild(c); caixas[e.k] = c; ligarCaixa(c);
      }
      const vis = !el.hidden && el.offsetWidth > 0;
      c.hidden = !vis; if (!vis) continue;
      const r = relTopo(el);
      Object.assign(c.style, {left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px'});
    }
  };
  function enviarPos(k, p) {
    const disp = dispositivo(), P = loja.tema.posicoes;
    if (disp === 'cel' && !P.cel) P.cel = JSON.parse(JSON.stringify(P.pc));
    (disp === 'cel' ? P.cel : P.pc)[k] = p;
    parent.postMessage({tipo: 'pos-elemento', el: k, pos: p, disp}, location.origin);
  }
  function ligarCaixa(c) {
    c.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation();
      const k = c.dataset.el, el = $(k), tam = !!e.target.closest('.alca');
      c.setPointerCapture(e.pointerId); c.classList.add('ativa');
      const p0 = {...posicoesAtuais()[k]}, r0 = relTopo(el);
      const sx = e.clientX, sy = e.clientY;
      let p = {...p0}, moveu = false;
      const mover = ev => {
        const dx = (ev.clientX - sx) / escTopo, dy = (ev.clientY - sy) / escTopo;
        if (!moveu && Math.abs(dx) + Math.abs(dy) < 4) return;
        moveu = true;
        if (tam) {
          if (k === 'logo') p.h = Math.min(800, Math.max(20, Math.round(r0.height + dy)));
          else {
            p.w = Math.max(40, Math.min(largUtil(), Math.round(r0.width + dx)));
            if (Math.abs(dy) > 3) p.hc = Math.max(16, Math.round(r0.height + dy));
          }
        } else {
          p.modo = 'livre'; p.y = Math.round(Math.max(0, r0.top + dy));
        }
        aplicarPos(k, p);
        if (p.modo === 'livre') {     // mantém a borda esquerda onde o usuário quer
          const L = r0.left - 16 + (tam ? 0 : dx);
          p.x = xDe(L, el.offsetWidth); aplicarPos(k, p);
        }
        ajustarTopo();
      };
      const soltar = () => {
        c.removeEventListener('pointermove', mover);
        c.classList.remove('ativa');
        if (moveu) enviarPos(k, p);
        else {
          parent.postMessage({tipo: 'elemento-clicado', el: k}, location.origin);
          if (TEXTOS.some(d => d.k === k)) parent.postMessage({tipo: 'texto-clicado', chave: k}, location.origin);
        }
      };
      c.addEventListener('pointermove', mover);
      c.addEventListener('pointerup', soltar, {once: true});
      c.addEventListener('pointercancel', soltar, {once: true});
    });
  }
  // o painel pede para tornar um item "livre" exatamente onde ele está agora
  window.addEventListener('message', e => {
    if (e.origin !== location.origin || !e.data || e.data.tipo !== 'tornar-livre') return;
    const k = e.data.el, el = $(k); if (!el) return;
    const r = relTopo(el);
    const p = {...posicoesAtuais()[k], modo: 'livre', y: Math.round(r.top)};
    aplicarPos(k, p); p.x = xDe(r.left - 16, el.offsetWidth); aplicarPos(k, p); ajustarTopo();
    enviarPos(k, p);
  });
}

iniciar();
</script>
